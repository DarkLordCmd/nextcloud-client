appId: com.nextcloud.desktop-client
productName: NextCloud Client
directories:
  output: dist

publish:
  - provider: github
    owner: DarkLordCmd
    repo: nextcloud-client

files:
  - src-electron/**
  - src-ui/dist/**

win:
  target: nsis
  signAndEditExecutable: false
  extraResources:
    - from: src-rust/target/release/nextcloud-client.exe
      to: bin/nextcloud-client.exe
    - from: build/aria2c.exe
      to: bin/aria2c.exe

linux:
  target:
    - AppImage
    - deb
  maintainer: DarkLordCmd
  extraResources:
    - from: src-rust/target/linux-release/nextcloud-client
      to: bin/nextcloud-client
    - from: src-rust/target/linux-release/aria2c
      to: bin/aria2c

deb:
  depends:
    - aria2

mac:
  target: dmg
  category: public.app-category.productivity