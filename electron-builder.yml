appId: com.nextcloud.desktop-client
productName: NextCloud Client
directories:
  output: dist

publish:
  - provider: github
    owner: DarkLordCmd
    repo: nextcloud-client

files:
  - src-electron/**
  - src-ui/dist/**

extraResources:
  - from: src-rust/target/release/nextcloud-client.exe
    to: bin/nextcloud-client.exe
  - from: build/aria2c.exe
    to: bin/aria2c.exe

win:
  target: nsis
  signAndEditExecutable: false

mac:
  target: dmg
  category: public.app-category.productivity

linux:
  target: AppImage